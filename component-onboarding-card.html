<!DOCTYPE html>

<head>

  <title></title>
  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>   

<meta charset="UTF-8">




</head>



<html lang="en">


<style>
    @import url("styles.css");

    html
    {
        margin: 4rem;
    }

    .onboarding-card-wrapper {
        max-width: 1000px;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-start;
        gap: var(--size-3);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border);
        padding: var(--size-3);
    }

    .card-content {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: flex-start;
        gap: var(--size-2);
    }

    .title-wrapper {
        display: flex;
        flex-direction: row;
        gap: var(--size-2);
        align-items: center;
    }

    .steps-wrapper {
        display: flex;
        flex-direction: row;
        gap: var(--size-1);
        align-items: center;
        padding: var(--size-0-5) var(--size-0-5) var(--size-0-5) var(--size-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
    }

    .card-steps {
        display: flex;
        flex-direction: column;
        gap: var(--size-2);

        & ul {
            list-style: none;
            padding-inline-start: 0;
        }

        & li {
            display: flex;
            flex-direction: row;
            gap: var(--size-1);
            align-items: center;
        }
    }

    .card-action {
        display: flex;
        justify-content: flex-end;
    }

</style>

<body>

<div class="onboarding-card-wrapper">
    <div class="card-content">
        <div class="title-wrapper">
            <div class="icon-wrapper"><i data-feather="check"></i></div>
            <h3>Card Title</h3>
        </div>
        <div class="steps-wrapper">
            <p class="small">0 of 5 Steps</p>
            <p class="small">|</p>
            <button class="btn small text">Hide Steps</button>
        </div>
        <p>description goes here</p>
    </div>
    <div class="card-steps">
        <h4>STEPS</h4>
        <ul>
            <li><i data-feather="circle"></i>Step 1</li>
            <li><i data-feather="check"></i>Step 2</li>
            <li><i data-feather="check"></i>Step 3</li>
            <li><i data-feather="check"></i>Step 4</li>
            <li><i data-feather="check"></i>Step 5</li>
        </ul>
    </div>
    <div class="card-action">
        <button class="btn primary">Setup <i data-feather="chevron-right"></i></button>
    </div>
</div>



<script>
    // Toggle "active" class on checkbox-wrapper when clicked
    $(document).on('click', '.checkbox-wrapper', function() {
        $(this).toggleClass('active');
        $(this).closest('.control-wrapper').toggleClass('active');
    });
</script>

<script>
    feather.replace();
</script>

</body>
